; WM2-WaterMaster main firmware (Girish Farm).
;   pio run -e wm2 -t upload && pio device monitor -e wm2
;   pio test -e native          (irrigation logic tests on the PC)
[platformio]
default_envs = wm2

[env:wm2]
; Pinned to the tested versions (Arduino-ESP32 2.0.17). Newer platforms
; (8.x, Arduino 3.x) build 1.57 MB and overflow the 1.25 MB app partition.
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_flags =
    -I../common
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=30000
lib_deps =
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_compat_mode = off
