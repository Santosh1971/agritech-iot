; Pinned (espressif32 6.12.0 = Arduino 2.0.17, same as wm_mini_c3): the
; unpinned platform moved to Arduino 3.x, where esp_task_wdt_init() takes a
; config struct and main.cpp no longer compiles.
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_flags =
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  knolleary/PubSubClient@2.8.0
  ESP32Async/AsyncTCP@3.5.0
  ESP32Async/ESPAsyncWebServer@3.12.1

; ---- WM-Mini C3 (ESP32-C3 Super Mini, relays on GPIOs) ----
; Also runs on the FG1 / ASC Mini-C3 carrier for bench tests (see src/Board.h).
;   pio run -e wm_mini_c3 -t upload && pio device monitor -e wm_mini_c3
; Pinned like the FG1 Greenhouse TH C3 build: espressif32 6.12.0 = Arduino
; 2.0.17, the version the C3 boards run.
[env:wm_mini_c3]
extra_scripts = pre:wmm_secrets.py
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = min_spiffs.csv
build_flags =
  -DBOARD_WM_MINI_C3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=30000
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  knolleary/PubSubClient@2.8.0
  ESP32Async/AsyncTCP@3.5.0
  ESP32Async/ESPAsyncWebServer@3.12.1
