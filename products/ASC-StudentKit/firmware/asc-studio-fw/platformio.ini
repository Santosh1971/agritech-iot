; ASC Studio firmware: one image for every ASC Student Kit (Mini and Mega)
; and for the ESP32-S3 DevKit stand-in used before the kit boards exist, plus
; a build for the GPSIOAM workshop kit (asc_gpsioam). A student's design is
; never compiled in: it arrives as JSON over USB serial or Bluetooth and is
; kept in flash. See ../README.md.
[platformio]
default_envs = asc_s3

[env:asc_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Native USB (USB-Serial/JTAG) for both flashing and the studio's Web Serial link.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps = ${common.lib_deps}
monitor_speed = 115200
extra_scripts = ${common.extra_scripts}

; Stand-in: the GPSIOAM workshop kit (classic ESP32 DevKit V1). Same firmware,
; the Mini's port names on the workshop kit's own wiring (src/standin_gpsioam.h).
[env:asc_gpsioam]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DASC_STANDIN_GPSIOAM
lib_deps = ${common.lib_deps}
monitor_speed = 115200
upload_speed = 921600
extra_scripts = ${common.extra_scripts}

[common]
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19
    adafruit/Adafruit BME280 Library @ ^2.2.4
    claws/BH1750 @ ^1.3.0
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/RTClib @ ^2.1.4
    h2zero/NimBLE-Arduino @ ~1.4.3

; gen_board_map.py turns ../../hardware/pinmap.json into src/board_map.h,
; so the firmware and the hardware can never disagree about a pin.
extra_scripts =
    pre:scripts/gen_board_map.py
    pre:scripts/inject_firmware_version.py

; Host-side unit tests for the rule engine: `pio test -e native`.
[env:native]
platform = native
build_src_filter = -<*>
test_build_src = no
build_flags = -std=c++17 -Isrc
