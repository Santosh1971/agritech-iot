; TH Monitor - Group 4: Firebase. Sends readings to a Firebase Realtime Database over HTTPS.
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  adafruit/RTClib
  tzapu/WiFiManager
