; TH Monitor - Group 2: offline logger. Saves readings to flash; a phone downloads them over SoftAP.
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld   ; 2 MB program + 2 MB for the log file system
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  adafruit/RTClib
