; Shared settings for every environment below. Pick which one to build/flash
; with `pio run -e <name> -t upload` (or select it in the VS Code PlatformIO
; environment picker at the bottom status bar).
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = min_spiffs.csv

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    ayushsharma82/ElegantOTA@^3.1
    adafruit/RTClib@^2.1
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
monitor_port = /dev/cu.usbserial-0001  ; optional, for Serial Monitor
upload_port = /dev/cu.usbserial-0001  ; explicit — prevents esptool auto-picking the wrong port

; ESPAsyncWebServer hardcodes a 3s per-client RX timeout with no build-flag
; override (unlike AsyncTCP's own ACK timeout below) -- too tight for a
; large OTA upload if a flash-write pause blocks the socket from draining
; for a moment. See scripts/patch_asyncwebserver_rx_timeout.py for why.
extra_scripts = pre:scripts/patch_asyncwebserver_rx_timeout.py

; ---- DS3231 build (field-deployed units) ----
[env:esp32dev]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DMQTT_MAX_PACKET_SIZE=1024
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=30000
    -I include

; ---- DS1307 build (bench-testing the cheaper chip) ----
[env:esp32dev_ds1307]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DMQTT_MAX_PACKET_SIZE=1024
    -DRTC_CHIP_DS1307
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=30000
    -I include