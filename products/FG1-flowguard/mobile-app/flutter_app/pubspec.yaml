name: smart_water_controller
description: Smart Water Controller — hybrid SoftAP/MQTT irrigation control
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # MQTT (cloud transport)
  mqtt_client: ^10.5.1

  # Local WebSocket transport (SoftAP)
  web_socket_channel: ^3.0.1
  
  # State management
  flutter_riverpod: ^2.6.1
  
  # Local storage
  shared_preferences: ^2.3.0
  
  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  intl: ^0.20.2
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg
    - assets/images/logo_icon.png

# Regenerates every platform's launcher icon from a single source image.
# Rebranding for a new customer is then just: replace assets/images/logo.jpeg,
# update the app name (below in this file's `name`/`description` are internal
# only — the user-facing name is set in android/app/src/main/AndroidManifest.xml's
# android:label and lib/main.dart's MaterialApp title), then run:
#   flutter pub get
#   flutter pub run flutter_launcher_icons
# which regenerates every icon size/density automatically before the next build.
flutter_launcher_icons:
  android: true
  ios: false
  # Uses the cropped square icon mark (logo_icon.png), not the full
  # wide wordmark image (logo.jpeg) -- the full logo's aspect ratio
  # doesn't fit a square icon slot without cropping off the "N"/"A"
  # edges of the text, same issue this fixed in the AppBar/loading
  # screen. The icon mark alone (leaf + "nb") is what actually reads
  # correctly at small icon sizes anyway.
  image_path: "assets/images/logo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
