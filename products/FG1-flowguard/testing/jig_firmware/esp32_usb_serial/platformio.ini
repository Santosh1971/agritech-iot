; FG1 test jig controller — ESP32, USB-serial version.
; Command/control is still purely USB-serial (wired to the same phone as
; the DUT via a USB-OTG hub -- no multi-unit targeting ambiguity, unlike
; the earlier WiFi-based jig, see jig_firmware/esp8266_wifi). As of
; docs/testing/JIG_NETWORK_BRIDGE_SPEC.md, the jig ALSO joins WiFi
; networks on request (JOIN_AP) and relays HTTP commands to the DUT's
; local API (HTTP_CMD) -- WiFi.h/HTTPClient.h are both bundled with the
; Arduino-ESP32 core already, no extra lib_deps needed for that.
;
; Flash with:
;   pio run -e esp32dev -t upload --upload-port /dev/cu.usbserial-XXXX

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
