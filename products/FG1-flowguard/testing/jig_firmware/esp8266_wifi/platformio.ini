; FG1 test jig controller — ESP8266, WiFi HTTP version.
; See docs/testing/PRODUCTION_TOOL_SPEC.md section 6.
;
; Flash with:
;   pio run -e d1_mini -t upload --upload-port /dev/cu.usbserial-XXXX
; Watch it join the DUT's SoftAP:
;   pio device monitor -b 115200

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
; 921600 times out mid-flash on some USB-serial adapters/cables
; ("Timed out waiting for packet header" right after the baud-rate
; change) -- 115200 is the safe fallback; bump to 460800 later if you
; want faster re-flashes and it proves reliable on your setup.
upload_speed = 115200
