; FG1 Polyhouse (Belgaum rose misting) — two builds from one project:
;
;   controller  FG1 at the pump panel: relay + T/RH sensor, WiFi/MQTT +
;               SoftAP, ESP-NOW hub for the sensor nodes, misting logic.
;   node        FG1 board without the relay: T/RH sensor only, talks to its
;               controller over ESP-NOW. Plug-and-play: added from the app.
;   native      host unit tests for the misting logic (no board needed):
;               pio test -e native
;
; Flash:  pio run -e controller -t upload     pio run -e node -t upload
;         ESP32-C3 Super Mini carrier: controller_c3 / node_c3 (native USB)
;
; Reuses the FG1 libraries that fit as-is (RTC, relay, LEDs, WiFi scan)
; straight from ../../firmware/lib, so fixes there reach this build too.

[esp]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_extra_dirs = ../../firmware/lib
; Same names as FG1 libs we replace here, or FG1-only features.
lib_ignore = LocalServer, MQTTClient, Scheduler, NVSManager, FlowSensor, BLEHandler
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DRTC_CHIP_DS1307
    -I include

[env:controller]
extends = esp
build_src_filter = +<controller/>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    ayushsharma82/ElegantOTA@^4.0
    adafruit/RTClib@^2.1
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
extra_scripts =
    pre:../../firmware/scripts/patch_asyncwebserver_rx_timeout.py
build_flags =
    ${esp.build_flags}
    -DFG1P_ROLE_CONTROLLER
    -DMQTT_MAX_PACKET_SIZE=1024
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=30000

[env:node]
extends = esp
build_src_filter = +<node/>
lib_deps =
    bblanchon/ArduinoJson@^7.0
build_flags =
    ${esp.build_flags}
    -DFG1P_ROLE_NODE

; ---- ESP32-C3 Super Mini carrier (FG1 / ASC Mini-C3 board) ----
[c3]
board = esp32-c3-devkitm-1
upload_speed = 460800
c3_flags =
    -DBOARD_FG1_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:controller_c3]
extends = env:controller
board = ${c3.board}
upload_speed = ${c3.upload_speed}
build_flags =
    ${env:controller.build_flags}
    ${c3.c3_flags}

[env:node_c3]
extends = env:node
board = ${c3.board}
upload_speed = ${c3.upload_speed}
build_flags =
    ${env:node.build_flags}
    ${c3.c3_flags}

[env:native]
platform = native
build_src_filter = -<*>
lib_ignore = THSensor
build_flags = -std=c++17 -I include
test_build_src = no
