name: asac_fg1
description: "ASAC FG1 — polyhouse misting controller (Agri Sensors and Controls)"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.5.1
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.0
  fl_chart: ^0.70.2
  intl: ^0.20.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo-mark.png
    - assets/images/logo-full.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo-mark.png"
  adaptive_icon_background: "#57B99C"
  adaptive_icon_foreground: "assets/images/logo-mark.png"
  adaptive_icon_foreground_inset: 14
  web:
    generate: true
    image_path: "assets/images/logo-mark.png"
    background_color: "#57B99C"
    theme_color: "#57B99C"
