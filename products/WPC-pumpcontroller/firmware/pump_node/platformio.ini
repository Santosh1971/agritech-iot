[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.0.0

monitor_speed = 115200
upload_speed = 921600
; CI dev builds (and a tagged release) override FW_VERSION without editing source --
; see scripts/inject_firmware_version.py.
extra_scripts =
    pre:scripts/inject_firmware_version.py
; adjust to your Pump Node board's port -- will likely differ from
; the Master's if both are plugged into the same Mac at once
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
