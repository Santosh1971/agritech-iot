[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; Pump Node's port -- this is a throwaway diagnostic sketch, flashed
; temporarily to isolate IN1/IN4 ADC readings from WiFi/LoRa/relay logic.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
