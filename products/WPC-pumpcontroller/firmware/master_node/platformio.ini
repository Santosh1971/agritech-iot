[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

monitor_speed = 115200
upload_speed = 921600
; CI dev builds (and a tagged release) override FW_VERSION without editing source --
; see scripts/inject_firmware_version.py.
extra_scripts =
    pre:scripts/inject_firmware_version.py
; adjust to your Master board's port -- may differ from the Pump Node's
upload_port = /dev/cu.usbserial-2
monitor_port = /dev/cu.usbserial-2
