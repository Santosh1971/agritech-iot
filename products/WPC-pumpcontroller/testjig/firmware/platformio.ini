; WPC factory test jig firmware -- runs on the WM1 (Water Manager) board, which
; has the same SX1262 LoRa wiring as the WPC nodes plus 6 relays (74HC595).
; No upload_port on purpose: with a jig and a DUT both on the USB hub, pass it
; explicitly:   pio run -t upload --upload-port /dev/cu.usbserial-XXXX
[env:esp32dev]
platform = espressif32 @ 6.12.0   ; pinned: unpinned CI pulled 8.0.0 (Arduino core 3.x), which breaks esp_read_mac
board = esp32dev
framework = arduino

lib_deps =
    jgromes/RadioLib @ ^6.6.0

monitor_speed = 115200
upload_speed = 921600
