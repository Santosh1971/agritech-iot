name: ASC Studio app — build and upload

# The phone app for ASC Student Kits (products/ASC-StudentKit/mobile-app).
# Every push that touches it is analysed, tested and built, on any branch; only
# main (dev-<shortsha>, admins only) and asc-app-v* tags (a release students
# can download from the studio's App stage) upload. Debug-signed like WPC's app.
on:
  push:
    branches: ["**"]
    tags: ["asc-app-v*"]
    paths:
      - "products/ASC-StudentKit/mobile-app/asc_studio_app/**"
      - ".github/workflows/asc-studio-app.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/ASC-StudentKit/mobile-app/asc_studio_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4" # the version the project was created and tested with
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == asc-app-v* ]]; then
            echo "value=${GITHUB_REF_NAME#asc-app-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-name="${{ steps.version.outputs.value }}"

      - name: Upload to the studio
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/asc-app-v')
        env:
          CI_UPLOAD_TOKEN: ${{ secrets.NB_FLASHER_CI_TOKEN }}
        run: |
          curl -sf -X POST https://agrisenseandcontrol.in/api/admin/app-builds \
            -H "Authorization: Bearer $CI_UPLOAD_TOKEN" \
            -F "versionName=${{ steps.version.outputs.value }}" \
            -F "buildType=debug" \
            -F "product=ASC_KIT" \
            -F "notes=Built by GitHub Actions from commit ${{ github.sha }} (run ${{ github.run_number }})" \
            -F "file=@build/app/outputs/flutter-apk/app-release.apk;type=application/vnd.android.package-archive"
