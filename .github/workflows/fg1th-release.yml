name: FG1 Greenhouse TH — release (ASAC TH app)

# Publishes the ASAC TH app (FG1 Greenhouse TH, products/FG1-flowguard/greenhouse-th)
# to the NB Agri Flasher under product FG1_TH, like wm2-release.yml does for WM2.
# Firmware is not published here: the C3 boards can't be flashed by the
# flasher app yet (see the release folders / READ ME for flashing by laptop).
#
# Triggers:
#   - push of a tag "fg1th-vX.Y.Z" -> publishes X.Y.Z from that tag
#   - manual run with release_version -> publishes from the chosen ref
#
# Guard: the version must equal the app's pubspec.yaml version and
# FIRMWARE_VERSION in firmware/include/Config.h, or the run fails before uploading.
#
# The APK is the arm64 split (about 19 MB; every current phone). Its versionCode
# is 2000 + build number, so it installs over the full-size APKs built earlier.
on:
  push:
    tags:
      - "fg1th-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish, e.g. 0.2.0 (must match pubspec.yaml and Config.h)"
        required: true
      parts:
        description: "What to publish"
        type: choice
        options: [both, firmware, app]
        default: both

jobs:
  # Firmware for the NB Agri Flasher: the four C3 builds (controller/node,
  # star and repeater), one flasher "variant" each. Uploaded WITHOUT
  # bootloader/partitions on purpose: the flasher writes the bootloader at
  # 0x1000 (classic ESP32), but a C3 boots from 0x0, so a "full flash" would
  # leave the board unbootable. App-only (0x10000) is also the update that
  # keeps the controller<->node pairing in NVS. A blank C3 still needs the
  # FULL-0x0 merged bin from the release folder.
  firmware:
    if: github.event_name == 'push' || inputs.parts != 'app'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/FG1-flowguard/greenhouse-th/firmware
    steps:
      - uses: actions/checkout@v4
      - name: Work out and check the version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$EVENT" = "push" ]; then V="${TAG#fg1th-v}"; else V="$INPUT_VERSION"; fi
          FW=$(sed -n 's/^#define FIRMWARE_VERSION[[:space:]]*"\(.*\)"/\1/p' include/Config.h)
          if [ "$FW" != "$V" ]; then echo "::error::Publishing $V but Config.h FIRMWARE_VERSION is '$FW'"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade platformio
      - name: Logic tests
        run: pio test -e native
      - name: Write include/Secrets.h
        # Same values as the boards already run (copied from the Mac's Secrets.h
        # into FG1TH_FW_* secrets), so the SoftAP password and update login match.
        env:
          MQTT_USER: ${{ secrets.FG1TH_FW_MQTT_USER }}
          MQTT_PASS: ${{ secrets.FG1TH_FW_MQTT_PASS }}
          SOFTAP_PASSWORD: ${{ secrets.FG1TH_FW_SOFTAP_PASSWORD }}
          OTA_USERNAME: ${{ secrets.FG1TH_FW_OTA_USERNAME }}
          OTA_PASSWORD: ${{ secrets.FG1TH_FW_OTA_PASSWORD }}
        run: |
          for k in MQTT_USER MQTT_PASS SOFTAP_PASSWORD OTA_USERNAME OTA_PASSWORD; do
            if [ -z "${!k}" ]; then echo "::error::Secret FG1TH_FW_$k is not set"; exit 1; fi
          done
          {
            echo "#pragma once"
            echo "// Written by CI from repo secrets."
            for k in MQTT_USER MQTT_PASS SOFTAP_PASSWORD OTA_USERNAME OTA_PASSWORD; do
              printf '#define %-16s "%s"\n' "$k" "${!k}"
            done
          } > include/Secrets.h
      - name: Build the four C3 firmwares
        run: |
          for e in controller_c3 node_c3 controller_c3_rpt node_c3_rpt; do pio run -e "$e"; done
      - name: Upload to NB Agri Flasher (app-only, one variant each)
        env:
          CI_UPLOAD_TOKEN: ${{ secrets.NB_FLASHER_CI_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          for e in controller_c3 node_c3 controller_c3_rpt node_c3_rpt; do
            case "$e" in
              controller_c3) what="controller, star";; node_c3) what="node, star";;
              controller_c3_rpt) what="controller, repeater";; node_c3_rpt) what="node, repeater";;
            esac
            curl -sf -X POST https://agrisenseandcontrol.in/api/admin/builds \
              -H "Authorization: Bearer $CI_UPLOAD_TOKEN" \
              -F "product=FG1_TH" \
              -F "version=${VERSION}" \
              -F "variant=${e}" \
              -F "notes=ASAC TH ${VERSION} ${what} (ESP32-C3, update only: keeps pairing). From ${GITHUB_REF_NAME} (${GITHUB_SHA})" \
              -F "file=@.pio/build/${e}/firmware.bin;type=application/octet-stream"
            echo "uploaded $e"
          done

  app:
    if: github.event_name == 'push' || inputs.parts != 'firmware'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/FG1-flowguard/greenhouse-th/app
    steps:
      - uses: actions/checkout@v4
      - name: Work out and check the version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$EVENT" = "push" ]; then V="${TAG#fg1th-v}"; else V="$INPUT_VERSION"; fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$V' is not a plain X.Y.Z version"; exit 1
          fi
          APP=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          FW=$(sed -n 's/^#define FIRMWARE_VERSION[[:space:]]*"\(.*\)"/\1/p' ../firmware/include/Config.h)
          if [ "$APP" != "$V" ]; then echo "::error::Publishing $V but pubspec.yaml version is '$APP'"; exit 1; fi
          if [ "$FW" != "$V" ]; then echo "::error::Publishing $V but Config.h FIRMWARE_VERSION is '$FW'"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"   # Gradle wrapper is 8.3; newer Flutter refuses it
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Same debug key as the APKs built on Santosh's Mac, so a new version
      # installs over the old one (the app uses the default debug signing).
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_B64 is not set: the APK would not install over earlier builds"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "FG1TH_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
      # The MQTT login lives only in git-ignored lib/services/secrets.dart (public repo).
      - name: Write secrets.dart
        env:
          MQTT_USER: ${{ secrets.FG1TH_MQTT_USER }}
          MQTT_PASS: ${{ secrets.FG1TH_MQTT_PASS }}
        run: |
          if [ -z "$MQTT_USER" ] || [ -z "$MQTT_PASS" ]; then
            echo "::error::Secrets FG1TH_MQTT_USER / FG1TH_MQTT_PASS are not set"; exit 1
          fi
          printf "// Written by CI from repo secrets.\nconst mqttUser = '%s';\nconst mqttPass = '%s';\n" \
            "$MQTT_USER" "$MQTT_PASS" > lib/services/secrets.dart
      - run: flutter pub get
      - name: Build release APK (arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Check the signing key
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner
          SHA=$("$AS" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$SHA" != "5a084b3d56913f0fe636e3d88d54a31127dfcf75e3196edf89f46954b6b2125a" ]; then
            echo "::error::APK signed with $SHA, not the key of the earlier builds"; exit 1
          fi
      - name: Upload to NB Agri Flasher
        env:
          CI_UPLOAD_TOKEN: ${{ secrets.NB_FLASHER_CI_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          curl -sf -X POST https://agrisenseandcontrol.in/api/admin/app-builds \
            -H "Authorization: Bearer $CI_UPLOAD_TOKEN" \
            -F "versionName=${VERSION}" \
            -F "buildType=debug" \
            -F "product=FG1_TH" \
            -F "notes=ASAC TH ${VERSION} (arm64), built by GitHub Actions from ${GITHUB_REF_NAME} (${GITHUB_SHA})" \
            -F "file=@build/app/outputs/flutter-apk/app-arm64-v8a-release.apk;type=application/vnd.android.package-archive"
