name: NB Agri Flasher app — build and upload

# Auto-build on push, mirroring the firmware workflows (fg1/wpc/wm1-firmware.yml).
# Debug-signed only — the release keystore stays on the dev Mac, never exposed
# to GitHub Actions. Avinash pulls debug builds from the dashboard to test;
# Kamta gets a release build built and signed locally when it's ready to ship.
on:
  push:
    branches: [main]
    paths:
      - "projects/tools/usb-otg-flash-spike/flasher-spike-app/**"
      - ".github/workflows/nb-agri-flasher-app.yml"
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/tools/usb-otg-flash-spike/flasher-spike-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null

      - name: Install NDK + CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload to NB Agri Flasher
        env:
          CI_UPLOAD_TOKEN: ${{ secrets.NB_FLASHER_CI_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          curl -sf -X POST https://agrisenseandcontrol.in/api/admin/app-builds \
            -H "Authorization: Bearer $CI_UPLOAD_TOKEN" \
            -F "versionName=dev-${SHORT_SHA}" \
            -F "buildType=debug" \
            -F "notes=Auto-built by GitHub Actions from commit ${{ github.sha }} (run ${{ github.run_number }})" \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk;type=application/vnd.android.package-archive"
